services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wayfinder_postgres
    environment:
      POSTGRES_USER: wayfinder
      POSTGRES_PASSWORD: wayfinder_secret
      POSTGRES_DB: wayfinder
    volumes:
      - ../docker/postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayfinder_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://wayfinder:wayfinder_secret@postgres:5432/wayfinder
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AMAP_KEY: ${AMAP_KEY}
      AMAP_SECURITY_CODE: ${AMAP_SECURITY_CODE}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped