<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能路线规划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-sidebar: #16213e;
            --bg-card: #0f3460;
            --accent: #e94560;
            --accent-gradient: linear-gradient(135deg, #e94560, #ff6b6b);
            --route-color: #00d9ff;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --border-radius: 8px;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .session-item {
            padding: 14px 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            margin-bottom: 8px;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.03);
        }

        .session-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .session-item.active {
            border-left-color: var(--accent);
            background: rgba(233, 69, 96, 0.15);
        }

        .session-title {
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .session-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Mobile menu toggle */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: var(--bg-card);
            border: none;
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 18px;
        }

        /* Main content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Form section */
        .form-section {
            padding: 24px;
            background: var(--bg-primary);
        }

        .form-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 28px;
            max-width: 900px;
            margin: 0 auto;
        }

        .form-title {
            font-size: 22px;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--border-radius);
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group select {
            cursor: pointer;
        }

        .submit-btn {
            background: var(--accent-gradient);
            border: none;
            color: white;
            padding: 14px 32px;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Map section */
        .map-section {
            padding: 0 24px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .map-container {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            flex: 1;
            min-height: 400px;
            position: relative;
        }

        #container {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        .map-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 400px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Output section */
        .output-section {
            padding: 0 24px 24px;
        }

        .output-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            font-family: "Courier New", monospace;
            font-size: 14px;
            line-height: 1.8;
            min-height: 180px;
            position: relative;
        }

        .output-container .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: var(--accent);
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .output-content {
            white-space: pre-wrap;
            color: var(--text-primary);
        }

        .output-placeholder {
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.9);
            z-index: 150;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(233, 69, 96, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-container {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

        <section class="map-section">

        </section>

        <section class="output-section">

    </main>

                    { name: '钟楼', lng: 108.943021, lat: 34.262321 },
                    { name: '回民街', lng: 108.946521, lat: 34.259876 },

                ]
            },
            chongqing: {

                center: [106.551643, 29.56301],
                landmarks: [
                    { name: '洪崖洞', lng: 106.587432, lat: 29.562876 },
                    { name: '解放碑', lng: 106.578123, lat: 29.558987 },
                    { name: '长江索道', lng: 106.588432, lat: 29.553987 },
                    { name: '武隆天生三桥', lng: 107.806543, lat: 29.412345 },
                    { name: '磁器口', lng: 106.444123, lat: 29.581234 },
                    { name: '鹅岭公园', lng: 106.532123, lat: 29.548765 },
                    { name: '南山一棵树', lng: 106.613456, lat: 29.536876 }
                ]
            }
        };

        // Preferences to route style mapping
        const preferencePatterns = {
            scenery: ['自然风光', '山水', '公园', '风景'],
            food: ['美食', '小吃', '夜市', '吃'],
            culture: ['历史', '文化', '博物馆', '古迹'],
            shopping: ['购物', '商业街', '商场', '逛街'],
            photo: ['拍照', '出片', '打卡', '网红'],
            leisure: ['休闲', '度假', '放松', '慢节奏']
        };

        let map = null;
        let markers = [];
        let routeLine = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function createMarkerIcon(text, bgColor) {
            return `<div style="
                width: 32px;
                height: 40px;
                background: ${bgColor};
                border-radius: 50% 50% 50% 0;
                transform: rotate(-45deg);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            ">
                <span style="
                    transform: rotate(45deg);
                    color: #fff;
                    font-size: 12px;
                    font-weight: bold;
                ">${text}</span>
            </div>`;
        }

        function createPOIMarker(name, index) {
            const colors = ['#e94560', '#00d9ff', '#4ade80', '#fbbf24', '#a855f7', '#f97316', '#ec4899'];
            const color = colors[index % colors.length];
            return `<div style="
                position: relative;
                width: 36px;
                height: 44px;
                display: flex;
                flex-direction: column;
                align-items: center;
            ">
                <div style="
                    width: 32px;
                    height: 32px;
                    background: ${color};
                    border-radius: 50% 50% 50% 0;
                    transform: rotate(-45deg);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
                    border: 2px solid rgba(255,255,255,0.8);
                ">
                    <span style="
                        transform: rotate(45deg);
                        color: #fff;
                        font-size: 11px;
                        font-weight: bold;
                    ">${index + 1}</span>
                </div>
                <div style="
                    margin-top: 2px;
                    padding: 2px 6px;
                    background: #fff;
                    border-radius: 4px;
                    font-size: 11px;
                    color: #333;
                    white-space: nowrap;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
                    max-width: 120px;
                    overflow: hidden;
                    text-overflow: ellipsis;
                ">${name}</div>
            </div>`;
        }

        function initMap(city = 'chongqing') {
            const container = document.getElementById('container');
            container.innerHTML = '';

            // 清除之前的地图对象和标记
            if (map) {
                map.destroy();
                map = null;
            }
            markers = [];
            routeLine = null;

            if (!cityData[city]) city = 'chongqing';
            const data = cityData[city];

            AMapLoader.load({
                key: AMAP_KEY,
                version: '2.0',
                plugins: ['AMap.Scale', 'AMap.ToolBar']
            }).then((AMap) => {
                map = new AMap.Map('container', {
                    viewMode: '3D',
                    zoom: 12,
                    center: data.center,
                    mapStyle: 'amap://styles/darkblue', // 深色主题
                });

                map.addControl(new AMap.Scale());
                map.addControl(new AMap.ToolBar({ position: 'right-bottom' }));

                // 添加地标点
                data.landmarks.forEach((landmark, index) => {
                    const marker = new AMap.Marker({
                        position: [landmark.lng, landmark.lat],
                        title: landmark.name,
                        offset: new AMap.Pixel(-18, -48),
                        content: createPOIMarker(landmark.name, index),
                    });

                    const infoWindow = new AMap.InfoWindow({
                        content: `<div style="padding: 10px 14px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                            <div style="font-size: 14px; font-weight: bold; color: #333; margin-bottom: 4px;">${landmark.name}</div>
                            <div style="font-size: 12px; color: #666;">景点位置</div>
                        </div>`,
                        offset: new AMap.Pixel(0, -55)
                    });

                    marker.on('click', () => {
                        infoWindow.open(map, marker.getPosition());
                    });

                    marker.setMap(map);
                    markers.push(marker);
                });

                // 设置显示所有标记的视野
                map.setFitView();
            }).catch(e => {
                console.error('地图加载失败:', e);
                container.innerHTML = '<div class="map-placeholder">地图加载失败，请检查 API Key 配置</div>';
            });
        }

        function drawRoute(city, routeIndices) {
            if (!map || !routeIndices || routeIndices.length < 2) return;

            const data = cityData[city];
            const path = routeIndices.map(idx => {
                const landmark = data.landmarks[idx];
                return [landmark.lng, landmark.lat];
            });

            // 清除之前的路线和标记
            if (routeLine) {
                map.remove(routeLine);
            }

            // 创建路线
            routeLine = new AMap.Polyline({
                path: path,
                isOutline: true,
                outlineColor: '#1a1a2e',
                borderWeight: 3,
                strokeColor: '#e94560',
                strokeOpacity: 1,
                strokeWeight: 5,
                strokeStyle: 'solid',
                lineJoin: 'round',
                lineCap: 'round',
                showDir: true,
                zIndex: 50,
            });

            map.add(routeLine);

            // 添加起点标记
            const startIdx = routeIndices[0];
            const startLandmark = data.landmarks[startIdx];
            const startMarker = new AMap.Marker({
                position: [startLandmark.lng, startLandmark.lat],
                content: createMarkerIcon('起', '#4ade80'),
                offset: new AMap.Pixel(-16, -40),
                zIndex: 100,
            });
            map.add(startMarker);

            // 添加终点标记
            const endIdx = routeIndices[routeIndices.length - 1];
            const endLandmark = data.landmarks[endIdx];
            const endMarker = new AMap.Marker({
                position: [endLandmark.lng, endLandmark.lat],
                content: createMarkerIcon('终', '#e94560'),
                offset: new AMap.Pixel(-16, -40),
                zIndex: 100,
            });
            map.add(endMarker);

            // 调整视野
            map.setFitView([routeLine, startMarker, endMarker]);
        }

        function generateRoute(city, preferences) {
            const data = cityData[city];
            if (!data) return [];

            const indices = data.landmarks.map((_, i) => i);

            let seed = city.length + preferences.length;
            for (let i = 0; i < preferences.length; i++) {
                seed += preferences.charCodeAt(i);
            }

            const random = (max) => {
                seed = (seed * 9301 + 49297) % 233280;
                return Math.floor((seed / 233280) * max);
            };

            for (let i = indices.length - 1; i > 0; i--) {
                const j = random(i + 1);
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }

            const count = 4 + random(3);
            return indices.slice(0, count);
        }

        function generateItinerary(city, startTime, endTime, preferences, route) {
            const data = cityData[city];
            const cityNames = {
                beijing: '北京', shanghai: '上海', hangzhou: '杭州',
                chengdu: '成都', xian: '西安', chongqing: '重庆'
            };

            const start = new Date(startTime);
            const end = new Date(endTime);
            const hours = Math.round((end - start) / (1000 * 60 * 60));
            const days = Math.ceil(hours / 24);

            let itinerary = `${cityNames[city]}旅行路线规划\n`;
            itinerary += `旅行时间: ${start.toLocaleDateString('zh-CN')} ${start.getHours()}:00 - `;
            itinerary += `${end.toLocaleDateString('zh-CN')} ${end.getHours()}:00\n`;
            itinerary += `旅行时长: 约 ${days} 天 ${hours % 24} 小时\n`;
            itinerary += `用户偏好: ${preferences}\n\n`;
            itinerary += '='.repeat(50) + '\n\n';

            route.forEach((idx, dayIdx) => {
                const landmark = data.landmarks[idx];
                const day = Math.floor(dayIdx / 2) + 1;
                const period = dayIdx % 2 === 0 ? '上午' : '下午';

                itinerary += `【第${day}天 ${period}】${landmark.name}\n`;
                itinerary += `  → 建议游览时间: ${1 + Math.floor(Math.random() * 2)}小时\n`;
                itinerary += `  → 特色: ${getLandmarkDescription(landmark.name)}\n\n`;
            });

            itinerary += '='.repeat(50) + '\n\n';
            itinerary += '路线总结:\n';
            itinerary += `本路线从【${data.landmarks[route[0]].name}】出发，`;
            itinerary += `途经 ${route.slice(1, -1).map(i => data.landmarks[i].name).join('、')}，`;
            itinerary += `最后抵达【${data.landmarks[route[route.length - 1]].name}】。\n\n`;
            itinerary += '祝您旅途愉快！';

            return itinerary;
        }

        let isTyping = false;

        async function handleSubmit(event) {
            event.preventDefault();

            if (isTyping) return;

            const city = document.getElementById('city').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const preferences = document.getElementById('preferences').value;

            if (!city || !startTime || !endTime || !preferences) {
                alert('请填写完整信息');
                return;
            }

            if (new Date(endTime) <= new Date(startTime)) {
                alert('结束时间必须晚于开始时间');
                return;
            }

            // Show loading
            document.getElementById('loadingOverlay').classList.add('active');

            // Generate route
            const route = generateRoute(city, preferences);

            // Simulate AI processing
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Hide loading
            document.getElementById('loadingOverlay').classList.remove('active');

            // Draw route on map
            drawRoute(city, route);

            // Generate itinerary text
            const itinerary = generateItinerary(city, startTime, endTime, preferences, route);

            // Typewriter effect
            await typewriterEffect(itinerary);
        }

        async function typewriterEffect(text) {
            isTyping = true;
            const outputContent = document.getElementById('outputContent');
            outputContent.innerHTML = '';
            outputContent.classList.remove('output-placeholder');

            for (let i = 0; i < text.length; i++) {
                outputContent.textContent = text.substring(0, i + 1);
                await new Promise(resolve => setTimeout(resolve, 25));
            }

            outputContent.innerHTML += '<span class="cursor"></span>';
            isTyping = false;
        }

        // Initialize
        window.addEventListener('load', () => {
            initMap('chongqing');
        });

        // Session item click
        document.querySelectorAll('.session-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // City change - reinitialize map
        document.getElementById('city').addEventListener('change', function() {
            if (this.value) {
                initMap(this.value);
            }
        });
    </script>
